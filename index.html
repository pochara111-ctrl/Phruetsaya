<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Space For Us 🤍</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #faf9f6;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #333333;
            --text-sub: #888888;
            --accent: #e0a9af;
            --accent-hover: #d4959c;
            --border: #f0ece9;
            --danger: #e76f51;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border);
        }

        .hero-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 20px;
            display: none;
        }

        h1 { font-size: 1.3rem; font-weight: 500; text-align: center; margin-bottom: 6px; }
        p.subtitle { font-size: 0.85rem; color: var(--text-sub); text-align: center; margin-bottom: 25px; font-weight: 300; }

        .form-group { margin-bottom: 20px; }
        label { font-size: 0.88rem; font-weight: 400; display: block; margin-bottom: 8px; color: #555; }

        .slider-container { text-align: center; }
        .percent-display { font-size: 2rem; font-weight: 500; color: var(--accent); margin-bottom: 5px; }
        input[type=range] {
            -webkit-appearance: none; width: 100%; height: 6px;
            background: #f0e6e7; border-radius: 5px; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px;
            border-radius: 50%; background: var(--accent); cursor: pointer;
        }

        textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border);
            border-radius: 12px; background: #fafafa; font-family: 'Prompt', sans-serif;
            font-size: 0.88rem; outline: none; resize: none;
        }
        textarea:focus { border-color: var(--accent); background: #fff; }
        .char-count { font-size: 0.75rem; text-align: right; color: var(--text-sub); margin-top: 4px; }

        button {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: var(--accent); color: white; font-family: 'Prompt', sans-serif;
            font-size: 0.92rem; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #e2dadb; cursor: not-allowed; }

        /* Chat */
        #chatSection { display: none; }
        .chat-box {
            height: 300px; border: 1px solid var(--border);
            border-radius: 16px; padding: 15px; overflow-y: auto;
            background: rgba(255,255,255,0.8); display: flex; flex-direction: column; gap: 10px;
            margin-bottom: 12px;
        }
        .message {
            max-width: 80%; padding: 10px 14px; border-radius: 14px;
            font-size: 0.88rem; line-height: 1.4; word-break: break-word;
        }
        .message.admin { align-self: flex-start; background: #fff; border: 1px solid var(--border); color: #333; }
        .message.fan { align-self: flex-end; background: var(--accent); color: #fff; }

        .chat-input-group { display: flex; gap: 8px; }
        .chat-input-group input {
            flex: 1; padding: 12px; border: 1px solid var(--border);
            border-radius: 12px; outline: none; font-family: 'Prompt', sans-serif;
        }
        .chat-input-group button { width: auto; padding: 0 18px; }
    </style>
</head>
<body>

    <!-- เครื่องเล่นเพลง BGM -->
    <audio id="bgm" loop></audio>

    <div class="container">
        <img id="coverImg" class="hero-img" alt="Cover Image">

        <!-- Form หน้าแรก -->
        <form id="loveForm">
            <h1 id="mainTitle">แค่ อยาก รู้ ความ ใน ใจ ... 🤍</h1>
            <p class="subtitle" id="subTitle">ตอบตามความรู้สึกจริงๆ ได้เลยนะ</p>

            <div class="form-group slider-container">
                <label id="lblSlider">เธอรักเราแค่ไหน?</label>
                <div class="percent-display"><span id="loveVal">100</span>%</div>
                <input type="range" id="loveRange" min="0" max="100" value="100">
            </div>

            <div class="form-group">
                <label id="lblMsg">อยากบอกอะไรกับเรามั้ย? ✨</label>
                <textarea id="loveMsg" rows="3" placeholder="พิมพ์บอกความในใจตรงนี้ได้เลยน้า..." required></textarea>
                <div class="char-count" id="charCount">0 / 50 ตัวอักษร</div>
            </div>

            <button type="submit" id="submitBtn" disabled>ส่งความรู้สึกให้เธอ 💌</button>
        </form>

        <!-- หน้า Live Chat -->
        <div id="chatSection">
            <h1>Our Live Space 💬</h1>
            <p class="subtitle">คุยกันตรงนี้ได้เลยนะ</p>

            <div class="chat-box" id="chatBox"></div>

            <div class="chat-input-group">
                <input type="text" id="chatInput" placeholder="พิมพ์ข้อความ..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">ส่ง</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://YOUR-PROJECT-default-rtdb.firebaseio.com" // ใส่ Database URL ของคุณ
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const sessionId = "session_" + Date.now();

        // โหลดการตั้งค่าจากหน้า Admin แบบ Realtime
        db.ref('settings').on('value', (snapshot) => {
            const data = snapshot.val();
            if(!data) return;

            if(data.title) document.getElementById('mainTitle').innerText = data.title;
            if(data.subtitle) document.getElementById('subTitle').innerText = data.subtitle;
            if(data.qSlider) document.getElementById('lblSlider').innerText = data.qSlider;
            if(data.qMsg) document.getElementById('lblMsg').innerText = data.qMsg;

            // รูปภาพ
            if(data.imgUrl) {
                const img = document.getElementById('coverImg');
                img.src = data.imgUrl;
                img.style.display = 'block';
            }
            if(data.bgUrl) {
                document.body.style.backgroundImage = `url('${data.bgUrl}')`;
            }

            // เพลง
            if(data.musicUrl) {
                const audio = document.getElementById('bgm');
                audio.src = data.musicUrl;
                audio.play().catch(() => {}); // เล่นอัตโนมัติเมื่อผู้ใช้คลิกหน้าจอ
            }
        });

        // Slider & Validation
        const range = document.getElementById('loveRange');
        range.addEventListener('input', (e) => document.getElementById('loveVal').textContent = e.target.value);

        const msgInput = document.getElementById('loveMsg');
        const submitBtn = document.getElementById('submitBtn');
        msgInput.addEventListener('input', () => {
            const len = msgInput.value.length;
            document.getElementById('charCount').textContent = `${len} / 50 ตัวอักษร`;
            submitBtn.disabled = len < 50;
        });

        // กดส่งฟอร์มเข้าสู่ Live Chat
        document.getElementById('loveForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // บันทึกคำตอบแรก
            db.ref(`chats/${sessionId}`).push({
                sender: 'fan',
                text: `[ตอบฟอร์ม: รัก ${range.value}%] ${msgInput.value}`,
                time: Date.now()
            });

            // แจ้งเตือนแอดมินว่ามี Session ใหม่
            db.ref(`active_sessions/${sessionId}`).set({
                lastMsg: msgInput.value,
                time: Date.now()
            });

            document.getElementById('loveForm').style.display = 'none';
            document.getElementById('chatSection').style.display = 'block';

            // ดึงข้อความแชต Realtime
            db.ref(`chats/${sessionId}`).on('child_added', (snapshot) => {
                const data = snapshot.val();
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message', data.sender);
                msgDiv.innerText = data.text;
                const box = document.getElementById('chatBox');
                box.appendChild(msgDiv);
                box.scrollTop = box.scrollHeight;
            });
        });

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            db.ref(`chats/${sessionId}`).push({
                sender: 'fan',
                text: text,
                time: Date.now()
            });
            input.value = '';
        }
    </script>
</body>
</html>
